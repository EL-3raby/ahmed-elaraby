      <stop offset="50%" stop-color="#0B0B0C" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D00" />
      <stop offset="100%" stop-color="#FF7A30" />
